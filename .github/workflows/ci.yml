name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*.*.*']

permissions:
  contents: write # required to create the GitHub Release on a tag

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go vet ./...
      # Without DATABASE_URL the integration tests self-skip (read-only).
      - run: go test ./...

  release:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: build binaries
        run: make build-all VERSION=${{ github.ref_name }}

      - name: publish release with binaries
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
