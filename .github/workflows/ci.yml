name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*.*.*']

permissions:
  contents: write # necessário para criar o GitHub Release na tag

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      # Sem DATABASE_URL, os testes de integração se auto-pulam (read-only).
      - run: go test ./...

  release:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: build binários
        run: make build-all VERSION=${{ github.ref_name }}

      - name: publicar release com os binários
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
